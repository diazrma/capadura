<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Capa Dura</title>
  <meta name="description" content="Capa Dura — sua estante de livros social. Escaneie, organize, descubra seu DNA literário e veja o que seus amigos estão lendo." />
  <meta name="theme-color" content="#1a120d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='8' y='10' width='14' height='46' rx='2' fill='%23b4441f'/><rect x='25' y='6' width='12' height='50' rx='2' fill='%23c9973b'/><rect x='40' y='14' width='14' height='42' rx='2' transform='rotate(8 47 35)' fill='%233b5b8f'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="Capa Dura — início">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="10" width="14" height="46" rx="2" fill="#b4441f"/><rect x="25" y="6" width="12" height="50" rx="2" fill="#c9973b"/><rect x="40" y="14" width="14" height="42" rx="2" transform="rotate(8 47 35)" fill="#3b5b8f"/></svg>
        <span>Capa<em>Dura</em></span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="#/" data-nav="home">Início</a>
        <a href="#/buscar" data-nav="buscar">Descobrir</a>
        <a href="#/dna" data-nav="dna" class="needs-auth">Meu DNA</a>
        <a href="#/eu" data-nav="eu" class="needs-auth">Minha estante</a>
      </nav>
      <form class="top-search" id="top-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" name="q" placeholder="Buscar livros, autores, leitores…" autocomplete="off" />
      </form>
      <button class="btn scan-top needs-auth" id="scan-top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
        Escanear
      </button>
      <div id="auth-area"></div>
    </div>
  </header>

  <main id="view" class="container"></main>

  <footer class="credits">
    <span class="credits-brand">Capa<em>Dura</em></span>
    <span>Criado por <b>Rodrigo Cardoso</b> · © <span id="year"></span></span>
  </footer>

  <!-- Barra de abas (celular) -->
  <nav class="tabbar" aria-label="Navegação">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg><span>Início</span></a>
    <a href="#/buscar" data-nav="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Descobrir</span></a>
    <button id="scan-tab" class="tab-scan needs-auth" aria-label="Escanear livro"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M16 8v8"/></svg></button>
    <a href="#/dna" data-nav="dna" class="needs-auth"><svg viewBox="0 0 24 24"><path d="M7 3c0 6 10 6 10 12s-10 6-10 6M17 3c0 6-10 6-10 12M8 7h8M8 17h8"/></svg><span>DNA</span></a>
    <a href="#/entrar" data-nav="entrar" class="needs-guest"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg><span>Entrar</span></a>
    <a href="#/eu" data-nav="eu" class="needs-auth"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="4" height="18" rx="1"/><path d="m15.5 4.5 4 .8-3 15.4-4-.8"/></svg><span>Estante</span></a>
  </nav>

  <!-- Modal / gaveta -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-close aria-label="Fechar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
